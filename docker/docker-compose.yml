services:
  arm-planning:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: arm-planning-is-not-magic:latest
    container_name: arm-planning-dev
    volumes:
      # Mount the project directory for live development
      - ..:/workspace/arm-planning-is-not-magic
      # Mount a volume for persistent data
      - arm-planning-data:/data
      # X11 forwarding
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace/arm-planning-is-not-magic
    ports:
      # Meshcat web UI — open http://localhost:7001/static/ in browser
      # Uses 7001 on host to avoid conflicts; meshcat runs on 7000 inside container
      - "7001:7000"
      # Meshcat ZMQ server
      - "6001:6000"
    environment:
      - PYTHONPATH=/workspace/arm-planning-is-not-magic
      - DISPLAY=${DISPLAY:-:0}
    stdin_open: true
    tty: true

volumes:
  arm-planning-data:
