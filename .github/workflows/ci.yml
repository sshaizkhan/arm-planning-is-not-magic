name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check core/ planners/ parameterization/ visualization/ demos/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Run tests (excluding OMPL)
        run: pytest tests/ -m "not ompl" -v --timeout=30

  test-ompl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t arm-planning-is-not-magic:ci -f docker/Dockerfile .
      - name: Run all tests (including OMPL) inside Docker
        run: |
          docker run --rm \
            -v "$PWD":/workspace/arm-planning-is-not-magic \
            -w /workspace/arm-planning-is-not-magic \
            arm-planning-is-not-magic:ci \
            bash -c "pip install pytest --quiet --root-user-action=ignore && pytest tests/ -v --timeout=30"
